  <body>
    <div id="app">
      <!-- Plain HTML for anything that does not run scripts (search engines, Google's app review). The app replaces it as soon as it loads. -->
      <main style="max-width:40rem;margin:2rem auto;padding:0 1rem;font-family:system-ui,sans-serif;line-height:1.5">
        <h1>Step Up Helper</h1>

      </main>
    </div>
