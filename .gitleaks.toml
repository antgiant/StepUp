title = "Step Up Helper"

[extend]
useDefault = true

# The Google Picker's API key is a public browser key by design: it is restricted to this site's origin and to the
# Picker API in Google Cloud, and ships in the page. Only that one rule in that one file is excused.
[[allowlists]]
description = "Public Google Picker browser API key"
targetRules = ["gcp-api-key"]
paths = ['''packages/web/src/googleAuth\.ts''']
